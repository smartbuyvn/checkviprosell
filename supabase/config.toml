Lỗi không đăng nhập được bằng google xác thực
Lỗi Google Login khi đổi tên miền 99% là do Danh sách cho phép (Whitelist) của Supabase hoặc Google chưa được cập nhật tên miền mới. Vì hệ thống mã nguồn của mình được thiết kế để tự động nhận diện tên miền (window.location.origin), nên mã nguồn hoàn toàn không có lỗi, bạn chỉ cần cấu hình lại 2 nơi sau là chắc chắn được:

1. Kiểm tra cực kỳ kỹ trên Supabase: Bạn vào Supabase -> Authentication -> URL Configuration. Đảm bảo:

Site URL: Bắt buộc là https://v.ninhle.com
Redirect URLs: Chắc chắn bạn đã ấn Add URI và có dòng https://v.ninhle.com/*. Để cẩn thận nhất, bạn hãy Add URI thêm một dòng nữa là: https://v.ninhle.com/auth/callback
2. Nếu bạn dùng API Key Google riêng (Google Cloud Console): Trong Supabase mục Providers -> Google, nếu bạn đang BẬT và tự điền Client ID + Client Secret của riêng bạn (thay vì dùng mặc định của Supabase), thì bạn BẮT BUỘC phải vào trang quản trị Google Cloud 
