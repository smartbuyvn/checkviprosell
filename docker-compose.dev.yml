services:
  # Supabase Local Postgres
  # Provides the actual database for Edge functions and React interactions
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: viprosell
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — Required for BullMQ (ai-jobs + render-jobs queues)
  # Start with: docker compose -f docker-compose.dev.yml up redis -d
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # NOTE: Physical render worker (render.worker.ts / FFmpeg) runs as a Node process outside Docker.
  # Start with: cd backend && npm run worker:render
  # Requires: FFmpeg installed in PATH on the host machine.

volumes:
  db_data:
  redis_data:
